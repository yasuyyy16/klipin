[project]
name = "klipin"
version = "0.1.0"
description = "Klipin: ubah livestream jadi klip vertikal 9:16 (aplikasi lokal)"
requires-python = ">=3.11"
dependencies = [
    "concurrent-log-handler>=0.9.31",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
klipin = "klipin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/klipin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint.isort]
known-first-party = ["klipin"]
